<!doctype html><html><meta charset="utf-8"><title>Portfolio video generator</title><style>body{background:#09111f;color:#eef4fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:24px}button{background:#63e1c2;border:0;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}canvas{display:block;width:min(90vw,960px);height:auto;margin:20px auto;border-radius:12px}p{color:#9baabd}</style><div class="box"><h1>Ali Mahmoud · Project Showcase</h1><p id="status">A short animated portfolio video using published app screens and clearly labelled concept artwork.</p><canvas id="screen" width="1280" height="720"></canvas><button id="go">Generate showcase video</button></div><script>
const items=[
 {title:'KORA HUB · ADMIN PANEL',sub:'Multi-tenant sports venue management',kind:'ILLUSTRATIVE CONCEPT',src:'assets/projects/kora-admin-concept.svg'},
 {title:'KORA HUB · BOOKING',sub:'Discover venues and reserve a pitch',kind:'ILLUSTRATIVE CONCEPT',src:'assets/projects/kora-booking-concept.svg'},
 {title:'CASHIER APP',sub:'Live sync · offline-ready workflows',kind:'ACTUAL APP STORE SCREENSHOTS',src:'assets/projects/cashier-1.jpg'},
 {title:'SANAD REWARDS',sub:'Challenges · goals · progress',kind:'ACTUAL APP STORE SCREENSHOTS',src:'assets/projects/sanad-1.jpg'},
 {title:'MUSLIM WAY',sub:'Prayer and lifestyle tools',kind:'ACTUAL PUBLIC APP SCREENSHOTS',src:'assets/projects/muslim-way-1.jpg'},
 {title:'CONCEPT APP DESIGNS',sub:'Booking · movies · banking',kind:'ILLUSTRATIVE PORTFOLIO CONCEPTS',src:'assets/projects/booking-mobile-concept.svg'}
];
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),button=document.getElementById('go');
function load(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
button.onclick=async()=>{button.disabled=true;status.textContent='Loading project visuals…';try{const imgs=await Promise.all(items.map(x=>load(x.src)));const stream=canvas.captureStream(30);const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const finished=new Promise(resolve=>recorder.onstop=resolve);recorder.start();const start=performance.now(),duration=3600,clip=items.length*duration;status.textContent='Recording the animated showcase…';function frame(now){const t=(now-start)%clip,i=Math.floor(t/duration),p=(t%duration)/duration,im=imgs[i],it=items[i],w=canvas.width,h=canvas.height;ctx.fillStyle='#09111f';ctx.fillRect(0,0,w,h);const scale=Math.max(w/im.width,h/im.height)*(1.04+p*.045),iw=im.width*scale,ih=im.height*scale,x=(w-iw)/2,y=(h-ih)/2;ctx.save();ctx.globalAlpha=.82;ctx.drawImage(im,x,y,iw,ih);ctx.restore();const shade=ctx.createLinearGradient(0,0,0,h);shade.addColorStop(0,'rgba(3,8,15,.18)');shade.addColorStop(.48,'rgba(3,8,15,.18)');shade.addColorStop(1,'rgba(3,8,15,.95)');ctx.fillStyle=shade;ctx.fillRect(0,0,w,h);ctx.fillStyle='#63e1c2';roundRect(64,60,Math.min(400,32+it.kind.length*12),38,19);ctx.fill();ctx.fillStyle='#07151b';ctx.font='700 14px Arial';ctx.fillText(it.kind,82,85);ctx.fillStyle='#eef4fb';ctx.font='700 52px Arial';ctx.fillText(it.title,64,570);ctx.fillStyle='#c2cfdd';ctx.font='26px Arial';ctx.fillText(it.sub,67,617);ctx.fillStyle='rgba(238,244,251,.76)';ctx.font='17px Arial';ctx.fillText('ALI MAHMOUD  ·  FLUTTER DEVELOPER',67,674);ctx.fillStyle='rgba(255,255,255,.25)';roundRect(67,697,1146,4,2);ctx.fill();ctx.fillStyle='#63e1c2';roundRect(67,697,1146*((i+p)/items.length),4,2);ctx.fill();if(now-start<clip)requestAnimationFrame(frame);else recorder.stop()}requestAnimationFrame(frame);await new Promise(r=>setTimeout(r,clip+150));if(recorder.state!=='inactive')recorder.stop();await finished;const blob=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ali-mahmoud-project-showcase.webm';a.click();status.textContent='Done — your showcase video is downloading.';button.textContent='Video generated'}catch(e){status.textContent='Could not make video in this browser: '+e.message;button.disabled=false}};
</script></html>
